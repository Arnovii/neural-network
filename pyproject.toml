[project]
name = "neural-network"
version = "0.2.0"
description = "Entrenamiento distribuido asincrono con arquitectura Parameter Server para clasificacion ImageNet-1k"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "datasets>=4.8.4",
    "dotenv>=0.9.9",
    "matplotlib>=3.10.8",
    "mplcursors>=0.7",
    "numpy>=2.4.2",
    "psutil>=6.0.0",
    "python-dotenv>=1.2.2",
    "torchvision>=0.25.0",
]

[dependency-groups]
dev = [
    "bandit>=1.8.0",
    "lizard>=1.17.14",
    "mypy>=1.15.0",
    "pylint>=3.3.0",
    "pytest-cov>=6.0.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "vulture>=2.14",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "Exports",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = [
    "E501",  # Line too long (docstrings/technical text exceed limit naturally)
]

[tool.ruff.lint.per-file-ignores]
"Scripts/*" = ["S101", "S311"]  # Asserts and random in test/simulation code
